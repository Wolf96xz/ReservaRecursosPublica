server:
  port: 8082

spring:
  application:
    name: notificaciones-service
  datasource:
    # Base propia del servicio (sin FKs ni joins con la de reservas). Los valores por defecto son de desarrollo local.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notificaciones}
    username: ${DB_USER:notificaciones}
    password: ${DB_PASSWORD:notificaciones}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo comprueba que el mapeo encaja con él.
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notificaciones-service
      # Un grupo nuevo empieza por el principio: no se pierden eventos publicados antes de arrancar.
      auto-offset-reset: earliest
    producer:
      # Solo se usa para publicar en el DLT.
      acks: all
      properties:
        max.block.ms: 5000
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

notificaciones:
  mail:
    remitente: no-reply@reservas.local
  reintentos:
    enabled: true
    # Un correo fallido se reintenta cada minuto hasta agotar los intentos y se queda en FALLIDA.
    intervalo-ms: 60000
    max-intentos: 5
    margen-segundos: 30
    lote: 50
